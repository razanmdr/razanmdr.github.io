- slug: fraud-detection-monitor
  visual: monitoring
  title: "Financial Fraud Detection Monitor"
  category: ml
  featured: true
  summary: >-
    Überwacht ein Betrugserkennungsmodell in Produktion. NannyML (CBPE) schätzt
    die Modellleistung, bevor echte Labels vorliegen.
  metric: {value: "94,36 %", label: "Baseline-Accuracy"}
  flow: ["Referenzdaten", "Modell", "Produktionsdaten", "NannyML CBPE", "Performance-Schätzung"]
  tags: ["NannyML", "scikit-learn", "Model Monitoring"]
  links:
    - {label: "Code", url: "https://github.com/razanmdr/Machine_Learning/tree/main/Monitoring%20A%20Financial%20Fraud%20Detection%20Model"}
  case:
    context: "Bei Betrugserkennung kommen echte Labels oft erst Wochen später. Bis dahin ist unklar, ob das Modell noch gut funktioniert."
    approach: "NannyML mit Confidence-Based Performance Estimation (CBPE), um die Leistung ohne Labels zu schätzen und Verschlechterungen früh zu erkennen."
    outcome: "Baseline-Accuracy von 94,36 % als Referenz für das Monitoring."

