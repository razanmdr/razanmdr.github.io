- slug: sentiment-analysis
  visual: models
  title: "Sentiment-Analyse von Social-Media-Daten"
  category: ml
  featured: true
  summary: >-
    Klassifiziert Tweets zur GOP-Debatte als negativ, neutral oder positiv.
    Textvorverarbeitung, TF-IDF und ein Vergleich von fünf ML-Modellen.
  metric: {value: "70 %", label: "Accuracy (SVM, bestes von 5 Modellen)"}
  models:
    - {name: "SVM", acc: 70}
    - {name: "Random Forest", acc: 69}
    - {name: "MLP", acc: 66}
    - {name: "Naive Bayes", acc: 65}
    - {name: "Decision Tree", acc: 61}
  flow: ["Tweets", "Bereinigung", "TF-IDF", "5 Modelle", "Vergleich"]
  tags: ["scikit-learn", "NLP", "TF-IDF"]
  links:
    - {label: "Code", url: "https://github.com/razanmdr/Sentiment-Analysis-With-Machine-Learning"}
  case:
    context: "Tweets zur GOP-Debatte, drei Klassen: negativ, neutral, positiv. Testmenge mit 2.775 Tweets, davon rund 62 % negativ."
    approach: "Case Folding, Entfernen von Stoppwörtern, Satzzeichen, Ziffern und Nicht-ASCII-Zeichen, danach TF-IDF. Verglichen wurden SVM, Naive Bayes, Decision Tree, Random Forest und ein Multi-Layer Perceptron."
    outcome: "SVM erreicht mit 70 % die höchste Accuracy, knapp vor Random Forest (69 %). Die neutrale und die positive Klasse sind wegen des Klassenungleichgewichts deutlich schwerer zu erkennen; Naive Bayes sagt fast nur ‚negativ‘ voraus."

- slug: bank-debt-recovery
  visual: image
  visual_image: {src: "static/img/bank-debts.webp", alt: "Tatsächliche vs. erwartete Rückzahlung um die 1.000-$-Schwelle (Notebook-Output)"}
  title: "Lohnt sich die teurere Inkasso-Strategie?"
  category: da
  featured: true
  summary: >-
    Regression Discontinuity auf 1.882 Bankkonten: Bringt die intensivere
    Inkasso-Strategie ab 1.000 $ erwarteter Rückzahlung mehr ein, als sie kostet?
  metric: {value: "+278 $", label: "Mehrertrag pro Kunde (p < 0,001)"}
  flow: ["Schwelle 1.000 $", "Balance-Tests", "OLS + Indikator", "Robustheits-Check"]
  tags: ["Regression Discontinuity", "statsmodels", "SciPy"]
  links:
    - {label: "Code", url: "https://github.com/razanmdr/Data-Analyst/tree/master/Which-Debts-Are-Worth-the-Bank's-Effort"}
  case:
    context: "Eine Bank setzt ab 1.000 $ erwarteter Rückzahlung eine intensivere Inkasso-Strategie ein, die pro Kunde 50 $ mehr kostet."
    question: "Ist der Sprung bei der tatsächlichen Rückzahlung an der Schwelle größer als die Mehrkosten?"
    approach: "Vergleich der Kunden knapp unter und über der Schwelle (900–1.100 $, 183 Kunden): Kruskal-Wallis-Test für Alter, Chi-Quadrat-Test für Geschlecht. Danach OLS-Regression mit Indikator für ≥ 1.000 $ und ein Robustheits-Check mit engerem Fenster (950–1.050 $)."
    outcome: "Alter (p = 0,063) und Geschlecht (p = 0,54) unterscheiden sich nicht signifikant, die Gruppen sind also vergleichbar. Die teurere Strategie bringt +278 $ pro Kunde (p < 0,001), im engeren Fenster +287 $ (p = 0,012) – deutlich mehr als die 50 $ Mehrkosten."

