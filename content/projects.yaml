- slug: masterarbeit-function-calling
  visual: thesis
  title: "Function Calling bei LLM-Agents im E-Commerce"
  category: ai
  featured: true
  badge: "Masterarbeit · 03/2027"
  summary: >-
    Wie zuverlässig wählen LLM-Agents das richtige Tool und extrahieren die
    richtigen Parameter? Benchmark mit 100 Testfällen, API-Modelle gegen lokale
    Open-Weight-Modelle, englische und deutsche Schemas und Anfragen.
  metric: {value: "100", label: "Testfälle im Benchmark"}
  flow: ["Testfälle (DE/EN)", "Tool-Schemas", "API- & lokale LLMs", "Tool-Auswahl & Parameter", "Auswertung"]
  tags: ["LLM-Evaluation", "Function Calling", "Schema-Lokalisierung"]
  links: []
  case:
    context: "LLM-Agents im E-Commerce müssen Tools zuverlässig aufrufen, auch wenn Anfrage und Tool-Schema nicht in derselben Sprache vorliegen."
    question: "Wie beeinflusst die Sprache von Anfrage und Tool-Schema die Tool-Auswahl und die Parameterextraktion?"
    approach: "Benchmark mit 100 Testfällen; Vergleich von API-Modellen mit lokalen Open-Weight-Modellen über englische und deutsche Schemas und Queries."
    status: "Laufende Masterarbeit an der EAH Jena, Abschluss voraussichtlich 03/2027."

