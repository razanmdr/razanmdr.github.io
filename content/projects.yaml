- slug: retail-customer-analytics
  visual: image
  visual_image: {src: "static/img/retail-segmente.webp", alt: "Anteil der Steigerer, Halter und Reduzierer (Analyse-Output)"}
  title: "Retail Customer Analytics: Wer wächst, wer geht, wirken Kampagnen?"
  category: da
  featured: true
  summary: >-
    1,47 Mio. Transaktionen von 2.469 Haushalten (Dunnhumby/84.51° Complete
    Journey): Segmentierung in Steigerer, Halter und Reduzierer,
    Kampagnenwirkung mit Kontrollgruppe und Einfluss von Einkommen und Kindern.
  metric: {value: "+44 %", label: "Jahresumsatz bei Einkommen > 75K vs. < 35K (p < 0,001)"}
  flow: ["1,47 Mio. Transaktionen", "Segmentierung H1 vs. H2", "Kampagnen-DiD", "Welch-t-Tests", "Empfehlungen"]
  tags: ["pandas", "Difference-in-Differences", "Segmentierung", "SciPy"]
  links:
    - {label: "Code", url: "https://github.com/razanmdr/Data-Analyst/tree/master/Retail-Customer-Analytics-Complete-Journey"}
  case:
    context: "Ein Lebensmittelhändler mit stagnierendem Wachstum besitzt Transaktions-, Demografie- und Kampagnendaten, nutzt sie aber kaum. Konzept gemeinsam mit Timur Manuev und Mohamed Saci Hameurreras im Kurs Customer Experience (Prof. Dr. Marek Opuszko) entwickelt, Analyse anschließend eigenständig umgesetzt."
    approach: "Segmentierung der 1.684 dauerhaft aktiven Haushalte nach Ausgabenveränderung 2. vs. 1. Halbjahr (±10 %). Wirkung von 19 Kampagnen (Type A/B/C) per Difference-in-Differences gegen nicht angesprochene Haushalte. Einkommens- und Kindergruppen mit Welch-t-Tests und Warenkorbanteilen verglichen."
    outcome: "Nur 18 % der Haushalte halten ihre Ausgaben stabil; Reduzierer verlieren rund 311 Tsd. $, fast so viel wie Steigerer hinzugewinnen (356 Tsd. $). Keine Kampagnenart zeigt einen messbaren Mehrumsatz gegenüber der Kontrollgruppe – trotz bis zu 15 % Coupon-Einlösung. Haushalte mit > 75K Einkommen geben 44 % mehr aus als < 35K, Haushalte mit Kindern 11 % mehr."
    status: "Empfehlung: Rückgewinnung der Reduzierer priorisieren und Kampagnen künftig mit randomisierter Kontrollgruppe messen."

- slug: wm-churn-prediction
  visual: image
  visual_image: {src: "static/img/wm-churn-threshold.webp", alt: "Gewinn in Abhängigkeit vom Threshold (Skript-Output)"}
  title: "Churn Prediction für einen WM-Sportartikel-Shop"
  category: ml
  featured: true
  badge: "Prüfungsprojekt · EAH Jena"
  summary: >-
    Welche Kunden kaufen nach der Fußball-WM weiter? Sechs Klassifikatoren mit
    10-facher Kreuzvalidierung, bewertet über eine Kostenmatrix in Euro statt
    über Accuracy, plus Threshold-Optimierung und K-Means-Segmentierung.
  metric: {value: "+4.812 €", label: "durch optimalen Threshold 0,87 statt 0,5"}
  flow: ["800 Kunden", "Signifikanztests", "6 Modelle · 10-fold CV", "Kostenmatrix", "Threshold-Optimierung"]
  tags: ["scikit-learn", "Kostenmatrix", "Threshold-Optimierung", "K-Means"]
  links:
    - {label: "Code", url: "https://github.com/razanmdr/Data-Analyst/tree/master/WM-Sportartikel-Churn-Prediction"}
  case:
    context: "Nach einer WM wandern viele Hype-Käufer ab. Der Shop will potenziellen Abwanderern einen 12-€-Rabattcode schicken, aber keine Codes an Kunden verschwenden, die ohnehin kaufen. Synthetischer, reproduzierbarer Datensatz mit 800 Kunden (42 % Churn), bewusst mit Rauschen und fehlenden Werten."
    approach: "Median-Imputation, Welch-t-Tests und Chi-Quadrat-Tests, danach Logistische Regression, Naive Bayes, Entscheidungsbaum, k-NN, Neuronales Netz und Random Forest mit 10-facher Kreuzvalidierung. Bewertung über eine Kostenmatrix (TP 150 €, FN 138 €, FP 0 €, TN 63 €) und Threshold-Optimierung über die ROC-Kurve."
    outcome: "Wer nur während der WM kauft, wandert zu 52 % ab, Stammkunden nur zu 22 %. Beste Accuracy: Logistische Regression (0,677). Der optimale Threshold 0,87 bringt 85.989 € – 4.812 € mehr als 0,5. Wichtigste Erkenntnis: Mit Standard-Threshold verdient jedes Modell weniger als ‚Rabatt an alle‘ (85.050 €); erst der wirtschaftlich gewählte Threshold schlägt diese Baseline."
    status: "Benotetes Prüfungsprojekt im M.Sc. E-Commerce. Threshold wurde wie in der Kurslösung auf den Trainingsdaten bestimmt."

