- slug: sentiment-analysis
  visual: models
  title: "Sentiment-Analyse von Social-Media-Daten"
  category: ml
  featured: true
  summary: >-
    Klassifiziert Tweets zur GOP-Debatte als negativ, neutral oder positiv.
    Textvorverarbeitung, TF-IDF und ein Vergleich von fünf ML-Modellen.
  metric: {value: "70 %", label: "Accuracy (SVM, bestes von 5 Modellen)"}
  models:
    - {name: "SVM", acc: 70}
    - {name: "Random Forest", acc: 69}
    - {name: "MLP", acc: 66}
    - {name: "Naive Bayes", acc: 65}
    - {name: "Decision Tree", acc: 61}
  flow: ["Tweets", "Bereinigung", "TF-IDF", "5 Modelle", "Vergleich"]
  tags: ["scikit-learn", "NLP", "TF-IDF"]
  links:
    - {label: "Code", url: "https://github.com/razanmdr/Sentiment-Analysis-With-Machine-Learning"}
  case:
    context: "Tweets zur GOP-Debatte, drei Klassen: negativ, neutral, positiv. Testmenge mit 2.775 Tweets, davon rund 62 % negativ."
    approach: "Case Folding, Entfernen von Stoppwörtern, Satzzeichen, Ziffern und Nicht-ASCII-Zeichen, danach TF-IDF. Verglichen wurden SVM, Naive Bayes, Decision Tree, Random Forest und ein Multi-Layer Perceptron."
    outcome: "SVM erreicht mit 70 % die höchste Accuracy, knapp vor Random Forest (69 %). Die neutrale und die positive Klasse sind wegen des Klassenungleichgewichts deutlich schwerer zu erkennen; Naive Bayes sagt fast nur ‚negativ‘ voraus."

