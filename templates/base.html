<!DOCTYPE html>
<html lang="de" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ person.name }}, {{ person.role }} in Jena{% endblock %}</title>
  <meta name="description" content="{% block desc %}{{ person.intro }}{% endblock %}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.desc() }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.base_url }}">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#EDF0EA">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ root }}static/css/style.css?v={{ asset_v }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2317231F'/><text x='50' y='68' font-size='54' font-family='sans-serif' font-weight='800' fill='%23F2D64B' text-anchor='middle'>DR</text></svg>">
  <script>document.documentElement.classList.remove('no-js')</script>
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="{{ root }}" aria-label="Dary Razan, Startseite">Dary Razan</a>
      <span class="status">Ab sofort in Vollzeit verfügbar</span>
      <button type="button" class="menu-btn" id="menu-toggle" aria-expanded="false" aria-controls="nav-links">Menü</button>
      <nav class="nav-links" id="nav-links" aria-label="Hauptnavigation">
        <a href="{{ root }}#arbeiten">Arbeiten</a>
        <a href="{{ root }}#projekte">Projekte</a>
        <a href="{{ root }}#lab">Lab</a>
        <a href="{{ root }}#werdegang">Werdegang</a>
        <a href="{{ root }}lebenslauf/">Lebenslauf</a>
        <a href="{{ root }}#kontakt">Kontakt</a>
      </nav>
    </div>
  </header>

  <main>{% block main %}{% endblock %}</main>

  <footer class="footer">
    <div class="wrap"><p>© 2026 {{ person.name }}, Jena. Statische Seite aus Python und Jinja2, keine Cookies, kein Tracking.</p></div>
  </footer>
  <script src="{{ root }}static/js/main.js?v={{ asset_v }}"></script>
</body>
</html>
